save:
  basedir: 'experiments/final/phonons'
  outdir: 'dir_dila'

data:
  data_loc: 'matbench_data/matbench_phonons'
  folds: [0,1,2,3,4]
  target_name: 'last phdos peak'
  test_size: 0.1
  batch_size: 256
  reweight: 'sqrt_inv'
  shuffle: true
  seed: 39
  cutoff: 5
  add_z_bond_coord: false
  atom_features: 'embed'
  edge_embed_size: 10

# DIR: Feature Distribution Smoothing
fds:
  bucket_num: 50
  start_update: 5
  start_smooth: 10
  kernel: 'gaussian'
  kernel_size: 2
  sigma: 3
  momentum: 0.90

model:
  state_input_shape: 2
  device: cuda:0

train:
  epoch_range: 500
  weighted_loss: true      # DIR uses cost-sensitive reweighting
  alpha_metric: 'dcor'
  dil_inform: true         # DILA loss term enabled
  dil_config:
    method: 'smooth'
    lambda: 1.05
    warmup_epochs: 10
    momentum: 0.1

hpo:
  trials: 16  # Number of Optuna trials (0 to skip)
  tune_dila: false
  force_hpo: true

multi_runs: 5  # Number of multi-seed runs after HPO

optimiser:
  name: 'AdamW'

scheduler:
  name: 'CosineAnnealingLR'

loss:
  loss: 'WeightedHuberLoss'
